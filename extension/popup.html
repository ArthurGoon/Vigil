<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Vigil</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M5.5 17.5c-1.6-6.3 4-11.6 11.2-11.4 7 .2 11.6 4.6 10.4 10.4-1.2 6-7.6 9.4-13.6 8.6C8 24.4 4.4 20.6 6 15.2" stroke="#e5372b" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="16.4" cy="15.6" r="3.4" fill="currentColor" />
        </svg>
        <span>vigil</span>
      </div>
      <span id="conn" class="conn" hidden></span>
      <button id="open-panel" class="icon-btn" title="Abrir painel" aria-label="Abrir painel">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M9 3h4v4M13 3L7.5 8.5M11.5 9.5V12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1h2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </header>

    <section class="pen">
      <button id="pen" class="pen-btn">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3.5 16.5l2.8-.7 9.4-9.4-2.1-2.1-9.4 9.4z" fill="currentColor" /><path d="M14.4 3.5l2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <span>Circular algo nesta página</span>
      </button>
      <p id="pen-note" class="pen-note">ou <kbd>Alt</kbd> <kbd>Shift</kbd> <kbd>V</kbd> em qualquer site</p>
    </section>

    <main id="app" aria-live="polite"></main>

    <footer class="foot">
      <span>Servidor</span>
      <button id="server" class="link"></button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
