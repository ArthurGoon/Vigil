# docker compose up --build
# Sobe Postgres, aplica as migrations, API (http://localhost:3000) e worker.
# Nenhuma conta externa é necessária: link de login e alertas saem no log.

x-app: &app
  build: .
  image: vigil:local
  init: true
  environment: &app-env
    DATABASE_URL: postgres://vigil:vigil@postgres:5432/vigil
    APP_URL: http://localhost:3000
    SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret}
    # Opcionais (lidos do .env, se existir)
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    MAGIC_LINK_FROM: ${MAGIC_LINK_FROM:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_EXTENSION_CLIENT_ID: ${GOOGLE_EXTENSION_CLIENT_ID:-}
    MIN_INTERVAL_MINUTES: ${MIN_INTERVAL_MINUTES:-5}
    MANUAL_CHECK_COOLDOWN_SECONDS: ${MANUAL_CHECK_COOLDOWN_SECONDS:-30}
  # Permite monitorar uma página servida na sua máquina via http://host.docker.internal:PORTA
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "5432:5432"
    volumes:
      - vigil_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["npm", "start"]
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  vigil_pg:
