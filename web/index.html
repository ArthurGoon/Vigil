<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vigil</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="Vigil, início">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M5.5 17.5c-1.6-6.3 4-11.6 11.2-11.4 7 .2 11.6 4.6 10.4 10.4-1.2 6-7.6 9.4-13.6 8.6C8 24.4 4.4 20.6 6 15.2" stroke="var(--red)" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="16.4" cy="15.6" r="3.4" fill="currentColor" />
        </svg>
        <span>vigil</span>
      </a>
      <span id="conn" class="conn" hidden></span>
      <div class="spacer"></div>
      <button id="new-watch" class="btn">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.5v9M2.5 7h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
        Novo alerta
      </button>
    </header>

    <div id="offline" class="offline-bar" hidden>
      Sem conexão com o servidor do Vigil. Ele ainda está rodando? Tentando de novo...
    </div>

    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" hidden>
        <div class="side-head">
          <span>Alertas</span>
          <span id="count" class="count"></span>
        </div>
        <ul id="list" class="list"></ul>
      </aside>
      <main id="main" class="main">
        <div class="loading" aria-label="Carregando"><span></span><span></span><span></span></div>
      </main>
    </div>

    <dialog id="editor" class="dialog">
      <form id="editor-form" method="dialog" novalidate>
        <header class="dialog-head">
          <h2 id="editor-title">Novo alerta</h2>
          <button type="button" class="icon-btn" data-close aria-label="Fechar">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
        </header>
        <div class="dialog-body">
          <p class="dialog-tip" id="editor-tip">O jeito mais fácil é pela extensão: abra a página e circule o trecho. Aqui você cria ou ajusta à mão.</p>
          <label class="field">
            <span class="label">Endereço da página</span>
            <input name="url" type="url" placeholder="https://empresa.com/vagas" required />
          </label>
          <label class="field">
            <span class="label">Nome</span>
            <input name="label" type="text" placeholder="Vagas da ACME" maxlength="200" />
          </label>
          <div class="field">
            <span class="label">Avisar quando o trecho</span>
            <div class="seg" role="group" aria-label="Avisar quando">
              <button type="button" data-mode="text_changed">mudar</button>
              <button type="button" data-mode="text_appears">aparecer</button>
              <button type="button" data-mode="text_disappears">sumir</button>
            </div>
          </div>
          <label class="field">
            <span class="label" id="target-label">Texto do trecho</span>
            <textarea name="targetText" rows="2" placeholder="Data Analyst" required></textarea>
            <span class="help" id="target-help"></span>
          </label>
          <div class="grid-2">
            <label class="field">
              <span class="label">Checar a cada</span>
              <select name="intervalMinutes">
                <option value="5">5 min</option>
                <option value="15">15 min</option>
                <option value="30">30 min</option>
                <option value="60" selected>1 hora</option>
                <option value="360">6 horas</option>
                <option value="1440">1 dia</option>
              </select>
            </label>
            <label class="field" id="selector-field">
              <span class="label">Seletor CSS <em>opcional</em></span>
              <input name="cssSelector" type="text" placeholder="#vagas li" spellcheck="false" class="mono" />
            </label>
          </div>
          <details class="advanced">
            <summary>Webhook</summary>
            <label class="field">
              <span class="label">URL que recebe um POST com a mudança <em>opcional</em></span>
              <input name="webhookUrl" type="url" placeholder="https://..." />
            </label>
          </details>
          <p class="form-error" id="editor-error" hidden></p>
        </div>
        <footer class="dialog-foot">
          <button type="button" class="btn ghost" data-close>Cancelar</button>
          <button type="submit" class="btn primary" id="editor-submit">Criar alerta</button>
        </footer>
      </form>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
