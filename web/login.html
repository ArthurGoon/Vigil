<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Vigil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="page-auth">
    <div class="noise" aria-hidden="true"></div>
    <header class="site-header">
      <a class="logo" href="/">Vigil</a>
    </header>

    <main class="auth-main">
      <section class="auth-panel">
        <h1>Entrar</h1>
        <p class="lede">
          Entre com Google para salvar seus alertas e receber e-mail quando algo mudar.
        </p>

        <a id="google-btn" class="btn btn-google" href="/auth/google?redirect=/app.html">
          <span class="g-icon" aria-hidden="true"
            ><svg width="18" height="18" viewBox="0 0 48 48">
              <path
                fill="#FFC107"
                d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z"
              />
              <path
                fill="#FF3D00"
                d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.1 4 9.2 8.5 6.3 14.7z"
              />
              <path
                fill="#4CAF50"
                d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.1 39.5 16 44 24 44z"
              />
              <path
                fill="#1976D2"
                d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.5 7.3l.1.1 6.2 5.2C36.8 39.2 44 34 44 24c0-1.3-.1-2.5-.4-3.5z"
              /></svg
          ></span>
          Continuar com Google
        </a>

        <p id="google-hint" class="hint muted hidden">
          Google ainda não está configurado no servidor. Use o link mágico abaixo ou peça as
          variáveis GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
        </p>

        <div class="auth-divider"><span>ou</span></div>

        <form id="login-form" class="stack-form">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="voce@empresa.com"
          />
          <button class="btn btn-ghost-dark" type="submit">Enviar link mágico</button>
        </form>

        <p id="login-status" class="form-status" role="status" aria-live="polite"></p>

        <div id="dev-link-box" class="dev-box hidden">
          <p class="dev-label">Link de desenvolvimento</p>
          <a id="dev-link" href="#"></a>
        </div>
      </section>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
